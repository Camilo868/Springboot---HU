<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify - Registrar Nuevo Lugar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-4 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Botón de regreso -->
                <div class="mb-3">
                    <a th:href="@{/admin/events}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Volver al Panel
                    </a>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h1 class="h4 mb-0 fw-bold text-success">
                            <i class="bi bi-geo-alt-fill me-2"></i>Registrar Nuevo Recinto / Lugar
                        </h1>
                        <p class="text-muted small mb-0 mt-1">Ingresa la información del nuevo espacio o auditorio.</p>
                    </div>
                    <div class="card-body p-4">

                        <!-- Formulario con th:action y th:object -->
                        <form th:action="@{/admin/venues}" th:object="${venue}" method="post">

                            <!-- Nombre del Recinto -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre del Recinto <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                                       placeholder="Ej: Sala de Conferencias Magna" required maxlength="200">
                                <div class="form-text">Máximo 200 caracteres. Campo obligatorio.</div>
                            </div>

                            <!-- Dirección -->
                            <div class="mb-3">
                                <label for="direccion" class="form-label fw-semibold">Dirección <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="direccion" th:field="*{direccion}"
                                       placeholder="Ej: Carrera 7 # 45-10" required maxlength="100">
                                <div class="form-text">Ubicación del recinto. Campo obligatorio.</div>
                            </div>

                            <!-- Capacidad -->
                            <div class="mb-4">
                                <label for="capacidad" class="form-label fw-semibold">Capacidad Máxima (Aforo) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="capacidad" th:field="*{capacidad}"
                                       placeholder="Ej: 250" required min="1">
                                <div class="form-text">Número máximo de asistentes permitidos.</div>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                                <a th:href="@{/admin/events}" class="btn btn-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-success px-4">
                                    <i class="bi bi-check-lg me-1"></i>Guardar
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/navbar :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
