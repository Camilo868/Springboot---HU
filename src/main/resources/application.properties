spring.application.name=Eventify

# Base de datos H2 persistente en archivo.
spring.datasource.url=jdbc:h2:file:./data/eventify
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate no crea ni modifica tablas automáticamente.
spring.jpa.hibernate.ddl-auto=validate

# Muestra las consultas SQL ejecutadas por Hibernate.
spring.jpa.show-sql=true

# Formatea las consultas SQL para que sean más legibles.
spring.jpa.properties.hibernate.format_sql=false

# Activa Flyway para controlar las migraciones de la base de datos.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Habilita la consola web de H2.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Muestra las consultas SQL generadas por Hibernate en los logs.
logging.level.org.hibernate.SQL=DEBUG

# Muestra los valores enlazados a los parámetros de las consultas SQL.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Documentar únicamente rutas de API en Swagger UI (excluir rutas /admin/** de vistas Thymeleaf)
springdoc.paths-to-match=/api/**
